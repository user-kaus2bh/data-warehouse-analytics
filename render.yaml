services:
  - type: web
    name: data-warehouse-analytics
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir dashboard app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DB_TYPE
        value: sqlite
      - key: DB_PATH
        value: data/warehouse.db
      - key: LOG_LEVEL
        value: INFO
